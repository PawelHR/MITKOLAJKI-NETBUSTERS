<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Operacja Biegun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Układ: „terminal misji” – wąska kolumna na telefon, szeroka siatka na rzutnik (#ekran). Jeden ciemny motyw: noc polarna. */
:root{
  --night:#0d1828; --panel:#14233a; --panel2:#1a2d49; --line:#2a4266;
  --text:#e9eff7; --muted:#93a7c3; --red:#e5554f; --gold:#f2c14e; --ok:#52c48f;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--text);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;
  background-image:radial-gradient(1200px 500px at 50% -200px,#1b3352 0%,transparent 70%);background-repeat:no-repeat}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wide{max-width:1400px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.card{text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
button.card:hover{border-color:var(--gold)}
.btn{font:600 1rem var(--f-body);border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--gold);color:#1d1606;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#06210f}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:500 1rem var(--f-body);background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-height:46px}
input.code{font-family:var(--f-mono);letter-spacing:.2em;text-transform:uppercase;font-size:1.2rem}
label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 .75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill.lock{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.msg{font-size:.92rem;padding:10px 12px;border-radius:8px;background:var(--panel2)}
.msg.err{color:#ffd0ce;background:color-mix(in srgb,var(--red) 22%,var(--panel))}
.msg.good{color:#c9f2dc;background:color-mix(in srgb,var(--ok) 20%,var(--panel))}
ul.tips{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px}
.back{background:none;border:0;color:var(--muted);font:500 .95rem var(--f-body);cursor:pointer;padding:6px 0;align-self:flex-start}
.back:hover{color:var(--text)}
.term-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:right;font-size:.8rem;color:var(--muted);max-width:50%;overflow-wrap:anywhere}
.badge b{display:block;color:var(--gold);font-size:1.1rem;letter-spacing:.12em}
.alert{border-left:3px solid var(--red);padding:2px 0 2px 12px;font-family:var(--f-mono);font-size:.85rem;color:#ffc2bf}
.key{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key span{font:600 .8rem var(--f-mono);text-align:center;padding:10px 4px;border-radius:6px;border:1px dashed var(--line);color:var(--muted);letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis}
.key span.on{border-style:solid;border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.st-num{font:700 2rem var(--f-display);color:var(--gold);line-height:1}
.deck{position:relative;height:300px;touch-action:pan-y}
.swipe{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;user-select:none;transition:transform .25s ease,opacity .25s ease;cursor:grab}
.swipe .from{font:600 .8rem var(--f-mono);color:var(--muted)}
.swipe .body{font-size:1.08rem}
.swipe .stamp{position:absolute;top:16px;right:16px;font:700 1.1rem var(--f-display);padding:4px 10px;border:2px solid;border-radius:6px;opacity:0;transform:rotate(8deg)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:500 1rem var(--f-body);text-align:left;background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;width:100%}
.opt[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--night))}
.opt.right{border-color:var(--ok)} .opt.wrong{border-color:var(--red)}
.cipher{font:600 1.35rem var(--f-mono);letter-spacing:.18em;word-break:break-word;color:var(--gold)}
.codebox{font:700 2.2rem var(--f-mono);letter-spacing:.3em;text-align:center;color:var(--gold);padding:14px;border:1px solid var(--gold);border-radius:10px;background:color-mix(in srgb,var(--gold) 8%,transparent);overflow-wrap:anywhere}
.url{font-family:var(--f-mono);font-size:.92rem;word-break:break-all}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s ease}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
th{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 .9rem var(--f-body);background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:8px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--gold);color:#1d1606;border-color:var(--gold)}
.members{display:flex;flex-wrap:wrap;gap:6px}
.screen{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.screen{grid-template-columns:1fr}}
.school{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.school .place{font:700 3rem var(--f-display);color:var(--muted);text-align:center}
.school.first{border-color:var(--gold)} .school.first .place{color:var(--gold)}
.school .nm{font:700 1.6rem var(--f-display)}
.school .avg{font:700 2.6rem var(--f-display);font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.school .avg small{display:block;font:500 .8rem var(--f-mono);color:var(--muted);letter-spacing:.06em}
.school .bar{height:14px;margin-top:10px}
.clock{font:700 2.4rem var(--f-display);font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:8px}
.feed div{font-family:var(--f-mono);font-size:.95rem;padding:8px 12px;border-radius:8px;background:var(--panel)}
.feed b{color:var(--ok)}
.mail{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mline{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font:400 .95rem/1.45 var(--f-body);color:var(--text);border-left:3px solid transparent}
.mline:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.mline.sel{background:color-mix(in srgb,var(--gold) 12%,var(--panel));border-left-color:var(--gold)}
.mline.right{border-left-color:var(--ok)} .mline.wrong{border-left-color:var(--red)}
.mline.mlink{color:#8fc1ff;text-decoration:underline;font-family:var(--f-mono);font-size:.85rem;overflow-wrap:anywhere}
.mline.matt{font-family:var(--f-mono);font-size:.88rem}
.mline .why{display:block;margin-top:6px;font:400 .85rem var(--f-body);color:var(--muted);text-decoration:none}
.browser{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.browser-bar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel2);border-bottom:1px solid var(--line)}
.browser-bar .lock{font-size:.9rem}
.urlbar{font:500 .92rem var(--f-mono);min-height:38px;padding:6px 10px;flex:1;min-width:0}
.browser-page{padding:16px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.logs{display:flex;flex-direction:column;gap:4px;background:#060d18;border:1px solid var(--line);border-radius:10px;padding:8px;overflow-x:auto}
.logline{all:unset;box-sizing:border-box;display:grid;grid-template-columns:64px 112px 78px 1fr;gap:8px;font:500 .8rem/1.4 var(--f-mono);color:var(--text);padding:6px 8px;border-radius:6px;cursor:pointer;min-width:420px}
.logline:hover:not(:disabled){background:var(--panel2)} .logline:focus-visible{outline:2px solid var(--gold)}
.logline.fail .lr{color:#ff9d98} .logline .lt{color:var(--muted)}
.logline.hit{background:color-mix(in srgb,var(--ok) 22%,transparent)}
.logline.gap{cursor:default;color:var(--muted);display:block;text-align:center;font-style:italic}
.door{border-radius:16px;border:2px solid var(--line);background:var(--panel);padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-height:280px;justify-content:center;transition:background .2s,border-color .2s}
.door.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.door.deny{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--panel))}
.door.learn{border-color:var(--gold)}
.door-icon{font-size:3.4rem;line-height:1}
.door-title{font:700 1.6rem var(--f-display)}
.door-sub{font:500 .9rem var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.door .codebox{width:100%}
.vault{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.vault{grid-template-columns:1fr}}
.vault-side{position:sticky;top:16px}
@media (max-width:900px){.vault-side{position:static}}
.vopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.vopts{grid-template-columns:1fr}}
.vopts .opt b{font-weight:600}
.hashline{font:600 1.15rem var(--f-mono);letter-spacing:.06em;color:var(--gold);overflow-wrap:anywhere}
.console{font:500 .88rem/1.5 var(--f-mono);background:#060d18;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:300px;max-height:300px;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.console .dim{color:var(--muted)} .console .good{color:var(--ok);font-weight:600} .console .bad{color:#ff9d98} .console .hint{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    intro:"Grinch postawił przy fabryce fałszywą sieć Wi-Fi. Elfy logowały się do niej i oddawały hasła. Zobaczcie, jak działa taka pułapka, a potem jak szybko pada słabe hasło do routera warsztatu. To hasło jest waszym PIN-em.",

  { id:"s2", nr:2, name:"Złam skarbiec", topic:"Symulator łamania haseł", frag:"ZORZA",

    tips:["Imiona, daty i nazwy drużyn to pierwsze, co sprawdza słownik.","Długa fraza z kilku losowych słów jest dużo mocniejsza niż krótkie „H@sło1!”.","Menedżer haseł pozwala mieć różne hasło do każdego konta."] },
  { id:"s3", nr:3, name:"Fałszywy Mikołaj", topic:"Śledztwo SOC: phishing, portal, logi", frag:"PIERNIK", hasTask:true,
    intro:"Księgowa fabryki dostała maila „od Mikołaja” i zatwierdziła przelew. Chwilę później ktoś grzebał w portalu prezentów. Jesteście zespołem SOC: przeanalizujcie maila, portal i logi serwera. Każde zadanie daje fragment PIN-u. Kod wejścia do śledztwa poda prowadzący.",
    story:"Mail przyszedł z podrobionym adresem do odpowiedzi, portal pokazywał cudze listy po zmianie numeru w adresie, a w logach widać, że Grinch zgadywał hasło admina przez 7 minut. Trzeci fragment klucza odzyskany.",
    tips:["Zanim klikniecie, sprawdźcie, kto naprawdę pisze i dokąd prowadzi link.","„Pilne!” i „do 17:00” to presja, która ma wyłączyć myślenie. Prośbę o pieniądze potwierdzajcie telefonicznie.","Jeśli po zmianie numeru w adresie widać cudze dane, to błąd strony. Zgłoście go, nie wykorzystujcie.","Setki nieudanych logowań z jednego adresu to atak. Dlatego konta blokują się po kilku próbach, a hasło admina musi być długie."] },
  { id:"s4", nr:4, name:"Biuro Grincha", topic:"Bezpieczeństwo fizyczne i Flipper Zero", frag:"RENIFER",
    intro:"Grinch wszedł do warsztatu z kopią karty elfa. Powtórzcie jego drogę: przeszukajcie biurko i ustalcie, czyja karta otwiera warsztat. Potem z pomocą członka koła skopiujcie ją Flipperem i przyłóżcie kopię do czytnika przy drzwiach. Czytnik pokaże PIN.",
    story:"Grinch nie musiał niczego łamać. Grafik dyżurów zdradził, czyja karta otwiera warsztat, a kartę elfa dało się skopiować w kilka sekund, gdy wyjął ją z etui. Ostatni fragment klucza jest wasz.",
    tips:["Karteczka z hasłem przy monitorze przekreśla nawet najlepsze hasło.","Grafiki, identyfikatory i plany budynku na widoku mówią obcym, kogo i gdzie szukać.","Karty dostępu to klucze. Część z nich da się odczytać z bliska i skopiować w kilka sekund. Trzymajcie je w etui ekranującym.","Nie podłączajcie znalezionych pendrive'ów."] }
];
const SIDE = [
  { id:"p1", name:"Prezent czy pułapka?", max:30, short:"Oceńcie 8 wiadomości. Trzeba trafić co najmniej 6." },
  { id:"p2", name:"Hasło do sań", max:20, short:"4 pytania o hasła. Trzeba trafić co najmniej 3." },

  { from:"SMS · 8080", body:"InPost: Twoja paczka jest wstrzymana. Dopłać 1,99 zł za dostawę: inpost-pl.delivery-24.com", bad:true, why:"Prawdziwa domena to inpost.pl. Tu „inpost” jest tylko ozdobą przed delivery-24.com." },

  { from:"SMS · Allegro", body:"Ostatnie godziny Black Week! Do -70%: allegro.pl.okazje-swieta.com", bad:true, why:"Liczy się końcówka adresu. Ta strona należy do okazje-swieta.com, nie do allegro.pl." },

  { from:"e-mail · Steam", body:"Znajomy wysłał Ci skin w prezencie! Zaloguj się, aby odebrać: steamcommunlty.com", bad:true, why:"Przyjrzyj się: „communlty” z literą l zamiast i. Fałszywa strona ukradnie konto." }

const PASS_Q = [
  { q:"Które hasło najtrudniej złamać?", a:["Mikolaj2026!","qwerty123","renifer-pierniki-sanki-zorza","M1k0l@j"], ok:2, why:"Długość wygrywa. Cztery losowe słowa są dużo mocniejsze niż krótkie hasło z podmienionymi literami." },

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (k === "class") el.className = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const norm = s => String(s||"").toUpperCase().replace(/\s+/g,"");

};
function randomCode(){ const b = crypto.getRandomValues(new Uint8Array(4)); return [...b].map(x=>ALPH[x%32]).join(""); }

function pointsOf(t){
  const u = t.unlocked||{}, s = t.side||{};
  return STATIONS.filter(x=>u[x.id]).length * STATION_PTS + SIDE.filter(x=>s[x.id]).reduce((a,x)=>a+x.max,0) + (Number(t.bonus)||0);

function ranking(){
  const teams = S.teams.map(t=>({ ...t, points:pointsOf(t), st:stationsOf(t) })).sort((a,b)=>b.points-a.points || a.name.localeCompare(b.name));
  const sch = schools().map((name,i)=>{
    // do średniej liczą się tylko drużyny, które zaliczyły co najmniej 1 stację (puste drużyny nie psują wyniku)
    const ts = teams.filter(t=>t.school===i && t.st>0);
    const sum = ts.reduce((a,t)=>a+t.points,0);
    return { i, name, count:ts.length, sum, avg: ts.length ? Math.round(sum/ts.length) : 0 };
  }).sort((a,b)=>b.avg-a.avg || b.sum-a.sum);
  return { teams, sch };
}

async function boot(){
  let cfg = MANUAL_CONFIG;
  if (!cfg){
    try { const r = await fetch("/__/firebase/init.json"); if (r.ok) cfg = await r.json(); } catch(e){}
  }
  if (!cfg){ put(h("h1",null,"Operacja Biegun"), h("div",{class:"msg err"},"Brak konfiguracji Firebase. Wgraj stronę na Firebase Hosting albo wklej konfigurację w MANUAL_CONFIG.")); return; }
  S.fb = initializeApp(cfg); S.auth = getAuth(S.fb); S.db = getFirestore(S.fb);
  onAuthStateChanged(S.auth, async user => {
    if (!user){
      try { await signInAnonymously(S.auth); } catch(e){ S.error = "Nie mogę połączyć się z serwerem gry. Sprawdź internet i odśwież stronę."; render(); }
      return;
    }
    S.user = user; S.isAdmin = false;
    if (!user.isAnonymous){
      try { S.isAdmin = (await getDoc(doc(S.db,"admins",user.uid))).exists(); } catch(e){ S.isAdmin = false; }
    }
    if (S.code) watchTeam(S.code);
    render();
  });
  onSnapshot(collection(S.db,"teams"), snap=>{
    const first = !S.teamsLoaded;
    const before = Object.fromEntries(S.teams.map(t=>[t.id, pointsOf(t)]));
    S.teams = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    S.teamsLoaded = true;
    if (!first) for (const t of S.teams){ const d = pointsOf(t) - (before[t.id] ?? 0); if (d > 0) FEED.unshift({ team:t.name, d, at:Date.now() }); }
    FEED.length = Math.min(FEED.length, 6);
    refresh();
  }, ()=>{ S.error = "Nie mogę pobrać rankingu."; refresh(); });
  onSnapshot(doc(S.db,"config","main"), s=>{ S.config = s.exists() ? s.data() : {}; refresh(); }, ()=>{});
  render();
}
const FEED = [];

function watchTeam(code){
  unsubTeam?.(); unsubMembers?.();
  S.teamLoaded = false;
  unsubTeam = onSnapshot(doc(S.db,"teams",code), async s=>{
    if (!s.exists()){
      leaveLocal("Waszej drużyny nie ma już w grze (organizator mógł ją usunąć). Załóżcie nową albo dołączcie do innej.");
      return;
    }
    S.team = { id:s.id, ...s.data() }; S.teamLoaded = true;
    refresh();
  }, ()=>{});
  unsubMembers = onSnapshot(collection(S.db,"teams",code,"members"), async s=>{
    S.members = s.docs.map(d=>({ id:d.id, ...d.data() }));
    // ten telefon zgubił członkostwo (np. wyczyszczone dane) – dołącz ponownie po cichu
    if (S.user && !S.members.some(m=>m.id===S.user.uid)){

    }
    refresh();
  }, ()=>{});
}
function leaveLocal(notice){
  unsubTeam?.(); unsubMembers?.(); unsubTeam = unsubMembers = null;
  S.code = ""; S.team = null; S.members = []; S.teamLoaded = false; ls.set("ob_team", null);
  S.notice = notice || ""; view = { type:"home" }; joinMode = "join"; render();
}
async function createTeam(name, school, nick){
  for (let i=0;i<5;i++){
    const code = randomCode();
    const b = writeBatch(S.db);
    b.set(doc(S.db,"teams",code), { name, school, createdAt:serverTimestamp(), createdBy:S.user.uid, unlocked:{}, side:{} });
    b.set(doc(S.db,"teams",code,"members",S.user.uid), { nick, joinedAt:serverTimestamp() });
    try { await b.commit(); return code; } catch(e){ if (!denied(e)) throw e; /* kod zajęty – losuj dalej */ }
  }
  throw new Error("Nie udało się założyć drużyny. Spróbujcie jeszcze raz.");
}
async function joinTeam(code, nick){
  const t = await getDoc(doc(S.db,"teams",code));
  if (!t.exists()) return false;
  await setDoc(doc(S.db,"teams",code,"members",S.user.uid), { nick, joinedAt:serverTimestamp() });
  return true;
}
// Transakcja zamiast zwykłego zapisu: wynik pojawia się dopiero, gdy serwer go przyjmie
// (zwykły zapis na chwilę pokazałby „odblokowane” nawet przy złym PIN-ie).
async function saveProgress(path, value){
  const ref = doc(S.db,"teams",S.code);
  await runTransaction(S.db, async tx => { const s = await tx.get(ref); if (!s.exists()) throw { code:"not-found" }; tx.update(ref, { [path]: value }); });
}

      h("p",{class:"muted",style:"margin-top:auto;font-size:.85rem"},"← pułapka · bezpieczne →"));

          h("tbody",null,
            h("tr",null,h("td",null,"RUDOLF06 (imię + dzień)"),h("td",{class:"num mono"},fmtTime(900/t.speed)),h("td",{class:"num mono"},fmtTime(900/bc.speed))),
            h("tr",null,h("td",null,"4 losowe słowa, np. sanki-zorza-piernik-kominek"),h("td",{class:"num mono"},fmtTime(S2/t.speed)),h("td",{class:"num mono"},fmtTime(S2/bc.speed)))))),
        h("p",{class:"muted small"},"Słabe hasło pada nawet przy wolnym bcrypt. Długa fraza z losowych słów wytrzymuje tygodnie przy MD5 i tysiące lat przy bcrypt."),
        h("button",{class:"btn ghost",onclick:()=>{ Object.assign(VS,{type:null,dict:null,mask:null,kase:null,running:false,fails:0,t0:Date.now(),done:false}); vaultRoot=null; renderVault(); }},"Nowa drużyna (reset)")));
    result.scrollIntoView({behavior:"smooth",block:"start"});
  }
  const result = h("div",{class:"stack"});
  const leak = h("section",{class:"card"},
    h("div",{class:"spread"}, h("span",{class:"eyebrow",style:"color:var(--red)"},"Wyciek z serwera fabryki"), clock),
    h("div",{class:"mono small"},"login: ", h("b",null,V.user)),
    h("div",{class:"hashline"}, V.hash.match(/.{1,8}/g).join(" ")),
    h("p",{class:"muted small"},"Hash to „odcisk palca” hasła. Nie da się go odwrócić, ale można sprawdzać kandydatów, aż odcisk się zgodzi. Waszym zadaniem jest dobrać tak, żeby kandydatów było jak najmniej."));
  vaultRoot = h("div",{class:"stack",style:"gap:20px"},
    h("div",{class:"stack",style:"gap:4px"}, h("span",{class:"eyebrow"},"Laboratorium 2 · symulator"), h("h1",null,"Złam skarbiec")),
    h("div",{class:"vault"},
      h("div",{class:"stack",style:"gap:18px"},
        leak,
        group("type","1. Typ hasha", V.types, it=>it.note),
        group("dict","2. Słownik", V.dicts, it=>fmtNum(it.size) + " słów"),
        group("mask","3. Maska", V.masks, it=>"×" + fmtNum(it.n)),
        group("kase","4. Wielkość liter", V.kases, ()=>"")),
      h("div",{class:"stack vault-side",style:"gap:12px"},
        h("h3",null,"Konsola"), log, est, runBtn, result)),
    h("p",{class:"muted small"},"To symulator: niczego naprawdę nie łamie, tylko liczy, ilu kandydatów trzeba by sprawdzić."));
  put(vaultRoot);
  line("> gotowy. Wybierzcie ustawienia i uruchomcie atak.", "dim");
  drawAll();
}

/* ===================== STACJA 4: CZYTNIK DRZWI (#drzwi) =====================
   Telefon koła z Androidem i Chrome udaje czytnik kart przy drzwiach warsztatu.
   Wpuszcza tylko kartę o numerze (UID) zapisanym w ustawieniach, a po wpuszczeniu
   pokazuje PIN wpisany przez organizatora. PIN-u nie ma w kodzie strony:
   leży tylko w pamięci telefonu-czytnika. */
let doorCfg = {};
try { doorCfg = JSON.parse(ls.get("ob_door") || "{}") || {}; } catch(e){ doorCfg = {}; }
const saveDoor = () => ls.set("ob_door", JSON.stringify(doorCfg));
let doorRoot = null, doorAbort = null, doorReset = null, doorLearn = false, doorWake = null;
const uidNorm = s => String(s||"").toUpperCase().replace(/[^0-9A-F]/g,"");
const uidShow = s => uidNorm(s).match(/.{1,2}/g)?.join(":") || "—";
function renderDoor(){
  app.className = "wrap";
  if (doorRoot && app.contains(doorRoot)) return;
  try { doorCfg = JSON.parse(ls.get("ob_door") || "{}") || {}; } catch(e){ doorCfg = {}; }
  const supported = "NDEFReader" in window;
  const screen = h("div",{class:"door idle"});
  const setState = (cls, title, sub, big) => {
    screen.className = "door " + cls;
    screen.replaceChildren(...[h("div",{class:"door-icon"}, cls==="ok" ? "🔓" : cls==="deny" ? "⛔" : cls==="learn" ? "📝" : "🔒"),
      h("div",{class:"door-title"}, title), sub ? h("div",{class:"door-sub"}, sub) : null, big ? h("div",{class:"codebox"}, big) : null].filter(Boolean));
  };
  const idle = () => setState(doorLearn ? "learn" : "idle", doorLearn ? "Przyłóż kartę elfa, żeby ją zapisać" : "Przyłóż kartę dostępu", doorLearn ? "Tryb organizatora" : "Warsztat Mikołaja · wejście tylko dla elfów z dyżuru");
  const later = ms => { clearTimeout(doorReset); doorReset = setTimeout(idle, ms); };
  const onRead = uid => {
    const u = uidNorm(uid);
    if (!u){ setState("deny","Nie udało się odczytać numeru karty","Przyłóżcie jeszcze raz, spokojnie, na 2 sekundy."); return later(4000); }
    if (doorLearn){
      doorCfg.uid = u; saveDoor(); doorLearn = false; drawCfg();
      setState("ok","Zapisano kartę elfa", uidShow(u)); return later(5000);
    }
    if (doorCfg.uid && u === doorCfg.uid){
      setState("ok","DOSTĘP PRZYZNANY","Karta elfa nr 77 · " + uidShow(u), doorCfg.pin || "(PIN nieustawiony)");
      try { navigator.vibrate?.([120,60,120]); } catch(e){}
      return later(20000);
    }
    setState("deny","ODMOWA","Nieznana karta · " + uidShow(u));
    try { navigator.vibrate?.(400); } catch(e){}
    later(5000);
  };
  const start = async () => {
    try {
      doorAbort?.abort(); doorAbort = new AbortController();
      const r = new NDEFReader();
      await r.scan({ signal: doorAbort.signal });
      r.onreading = e => onRead(e.serialNumber);
      r.onreadingerror = () => { setState("deny","Nie udało się odczytać karty","Przyłóżcie jeszcze raz."); later(4000); };
      try { doorWake = await navigator.wakeLock?.request("screen"); } catch(e){}
      startBtn.hidden = true; idle();
    } catch(e){
      setState("deny","Czytnik nie wystartował", e && e.name === "NotAllowedError" ? "Zezwól stronie na NFC i włącz NFC w telefonie." : "Włącz NFC w ustawieniach telefonu i spróbujcie ponownie.");
    }
  };
  const startBtn = h("button",{class:"btn",style:"width:100%",onclick:start},"Uruchom czytnik");
  const pinIn = h("input",{id:"door-pin",class:"code",maxlength:"16",placeholder:"PIN",value:doorCfg.pin||"",autocomplete:"off"});
  const cfgInfo = h("p",{class:"small muted"});
  const drawCfg = () => { cfgInfo.textContent = "Zapisana karta: " + (doorCfg.uid ? uidShow(doorCfg.uid) : "brak") + " · PIN: " + (doorCfg.pin ? "ustawiony" : "brak"); };
  drawCfg();
  const cfg = h("details",{class:"card"},
    h("summary",{style:"cursor:pointer"},"Ustawienia czytnika (dla koła)"),
    h("p",{class:"small"},"1. Uruchom czytnik. 2. Kliknij „Zapisz kartę elfa” i przyłóż oryginalną kartę elfa. 3. Wpisz PIN stacji i zapisz. Ustawienia zostają w tym telefonie."),
    h("button",{class:"btn ghost",onclick:()=>{ doorLearn = true; idle(); }},"Zapisz kartę elfa"),
    h("form",{class:"row",onsubmit:e=>{ e.preventDefault(); doorCfg.pin = norm(pinIn.value); saveDoor(); pinIn.blur(); drawCfg(); }},
      h("label",{for:"door-pin",style:"flex:1"},"PIN pokazywany po wpuszczeniu", pinIn), h("button",{class:"btn sm",type:"submit",style:"align-self:flex-end"},"Zapisz PIN")),
    cfgInfo,
    h("button",{class:"btn sm ghost",onclick:()=>onRead(doorCfg.uid || "")},"Test: udawaj dobrą kartę"));
  if (!supported) setState("deny","Ten telefon nie obsługuje czytania NFC w przeglądarce","Potrzebny jest telefon z Androidem, włączonym NFC i przeglądarką Chrome.");
  else idle();
  doorRoot = h("div",{class:"stack",style:"gap:16px"},
    h("div",{class:"stack",style:"gap:4px"}, h("span",{class:"eyebrow"},"Laboratorium 4 · drzwi warsztatu"), h("h1",null,"Czytnik kart")),
    screen, supported ? startBtn : null, cfg);
  put(doorRoot);
}

/* ===================== ROUTER ===================== */
const route = () => (location.hash||"").replace("#","");
function render(){
  const r = route();
  if (r !== "ekran") clearInterval(clockTimer);
  if (r !== "skarbiec"){ clearInterval(vaultTimer); vaultRoot = null; }
  if (r !== "drzwi"){ doorAbort?.abort(); doorAbort = null; doorRoot = null; try { doorWake?.release(); } catch(e){} }
  if (r === "ekran") renderScreen();
  else if (r === "admin") renderAdmin();
  else if (r === "pulapka") renderTrap();
  else if (r === "skarbiec") renderVault();
  else if (r === "drzwi") renderDoor();
  else renderPlayer();
}
// odświeżenie po zmianie danych – bez przerywania kogoś w trakcie pisania albo zadania
function refresh(){
  const r = route(), a = document.activeElement, typing = a && ["INPUT","SELECT","TEXTAREA"].includes(a.tagName);
  if (r === "ekran") return renderScreen();
  if (typing) return;
  if (r === "admin") return S.user && !S.user.isAnonymous ? renderAdmin() : undefined; // nie kasuj formularza logowania
  if (r === "pulapka" || r === "skarbiec" || r === "drzwi") return;
  if (!S.code || !S.teamLoaded || view.type === "home" || view.type === "station" || view.type === "key") renderPlayer();
}
window.addEventListener("hashchange", ()=>{ adminMsg = {text:"",kind:""}; render(); window.scrollTo(0,0); });
boot();
</script>
