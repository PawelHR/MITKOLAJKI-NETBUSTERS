<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1828">
<title>Operacja Biegun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Układ: „terminal misji” – wąska kolumna na telefon, szeroka siatka na rzutnik (#ekran). Jeden ciemny motyw: noc polarna. */
:root{
  --night:#0d1828; --panel:#14233a; --panel2:#1a2d49; --line:#2a4266;
  --text:#e9eff7; --muted:#93a7c3; --red:#e5554f; --gold:#f2c14e; --ok:#52c48f;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--text);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;
  background-image:radial-gradient(1200px 500px at 50% -200px,#1b3352 0%,transparent 70%);background-repeat:no-repeat}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wide{max-width:1400px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.card{text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
button.card:hover{border-color:var(--gold)}
.btn{font:600 1rem var(--f-body);border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--gold);color:#1d1606;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#06210f}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:500 1rem var(--f-body);background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-height:46px}
input.code{font-family:var(--f-mono);letter-spacing:.2em;text-transform:uppercase;font-size:1.2rem}
label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 .75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill.lock{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.msg{font-size:.92rem;padding:10px 12px;border-radius:8px;background:var(--panel2)}
.msg.err{color:#ffd0ce;background:color-mix(in srgb,var(--red) 22%,var(--panel))}
.msg.good{color:#c9f2dc;background:color-mix(in srgb,var(--ok) 20%,var(--panel))}
ul.tips{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px}
.back{background:none;border:0;color:var(--muted);font:500 .95rem var(--f-body);cursor:pointer;padding:6px 0;align-self:flex-start}
.back:hover{color:var(--text)}
.term-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:right;font-size:.8rem;color:var(--muted);max-width:50%;overflow-wrap:anywhere}
.badge b{display:block;color:var(--gold);font-size:1.1rem;letter-spacing:.12em}
.alert{border-left:3px solid var(--red);padding:2px 0 2px 12px;font-family:var(--f-mono);font-size:.85rem;color:#ffc2bf}
.key{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key span{font:600 .8rem var(--f-mono);text-align:center;padding:10px 4px;border-radius:6px;border:1px dashed var(--line);color:var(--muted);letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis}
.key span.on{border-style:solid;border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.st-num{font:700 2rem var(--f-display);color:var(--gold);line-height:1}
.deck{position:relative;height:300px;touch-action:pan-y}
.swipe{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;user-select:none;transition:transform .25s ease,opacity .25s ease;cursor:grab}
.swipe .from{font:600 .8rem var(--f-mono);color:var(--muted)}
.swipe .body{font-size:1.08rem}
.swipe .stamp{position:absolute;top:16px;right:16px;font:700 1.1rem var(--f-display);padding:4px 10px;border:2px solid;border-radius:6px;opacity:0;transform:rotate(8deg)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:500 1rem var(--f-body);text-align:left;background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;width:100%}
.opt[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--night))}
.opt.right{border-color:var(--ok)} .opt.wrong{border-color:var(--red)}
.cipher{font:600 1.35rem var(--f-mono);letter-spacing:.18em;word-break:break-word;color:var(--gold)}
.codebox{font:700 2.2rem var(--f-mono);letter-spacing:.3em;text-align:center;color:var(--gold);padding:14px;border:1px solid var(--gold);border-radius:10px;background:color-mix(in srgb,var(--gold) 8%,transparent);overflow-wrap:anywhere}
.url{font-family:var(--f-mono);font-size:.92rem;word-break:break-all}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s ease}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
th{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 .9rem var(--f-body);background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:8px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--gold);color:#1d1606;border-color:var(--gold)}
.members{display:flex;flex-wrap:wrap;gap:6px}
.screen{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.screen{grid-template-columns:1fr}}
.school{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.school .place{font:700 3rem var(--f-display);color:var(--muted);text-align:center}
.school.first{border-color:var(--gold)} .school.first .place{color:var(--gold)}
.school .nm{font:700 1.6rem var(--f-display)}
.school .avg{font:700 2.6rem var(--f-display);font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.school .avg small{display:block;font:500 .8rem var(--f-mono);color:var(--muted);letter-spacing:.06em}
.school .bar{height:14px;margin-top:10px}
.clock{font:700 2.4rem var(--f-display);font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:8px}
.feed div{font-family:var(--f-mono);font-size:.95rem;padding:8px 12px;border-radius:8px;background:var(--panel)}
.feed b{color:var(--ok)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:4px}
.bub{max-width:88%;padding:9px 12px;border-radius:12px;font-size:.95rem;line-height:1.4}
.bub b{display:block;font-size:.72rem;letter-spacing:.04em;opacity:.7;margin-bottom:3px}
.bub.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--gold) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-bottom-right-radius:4px}
.gamewrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0d1b33}
.gamecv{display:block;width:100%;height:auto;outline:none}
.gamecv:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.ordlist{display:flex;flex-direction:column;gap:8px}
.ord{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;touch-action:none;transition:border-color .15s}
.ord.drag{border-color:var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.45);position:relative;z-index:5;opacity:.97}
.ord.ok{border-color:var(--ok)} .ord.bad{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.ord .grip{color:var(--muted);cursor:grab;font-size:1.1rem;line-height:1}
.ord .onum{font:700 1rem var(--f-display);color:var(--gold);min-width:1.1em}
.ord .otxt{font-size:.95rem;line-height:1.35;min-width:0}
.ord .otxt .why{display:block;margin-top:5px;font-size:.84rem;color:var(--muted)}
.ord .oarr{display:flex;flex-direction:column;gap:3px}
.ord .oarr .btn{min-height:26px;padding:1px 9px;font-size:.8rem}
.mail{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mline{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font:400 .95rem/1.45 var(--f-body);color:var(--text);border-left:3px solid transparent}
.mline:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.mline.sel{background:color-mix(in srgb,var(--gold) 12%,var(--panel));border-left-color:var(--gold)}
.mline.right{border-left-color:var(--ok)} .mline.wrong{border-left-color:var(--red)}
.mline.mlink{color:#8fc1ff;text-decoration:underline;font-family:var(--f-mono);font-size:.85rem;overflow-wrap:anywhere}
.mline.matt{font-family:var(--f-mono);font-size:.88rem}
.mline .why{display:block;margin-top:6px;font:400 .85rem var(--f-body);color:var(--muted);text-decoration:none}
.sql{font:600 .9rem/1.6 var(--f-mono);background:#060d18;border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin:0}
.sql .sv{color:var(--gold)}
.browser{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.browser-bar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel2);border-bottom:1px solid var(--line)}
.browser-bar .lock{font-size:.9rem}
.urlbar{font:500 .92rem var(--f-mono);min-height:38px;padding:6px 10px;flex:1;min-width:0}
.browser-page{padding:16px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.logs{display:flex;flex-direction:column;gap:4px;background:#060d18;border:1px solid var(--line);border-radius:10px;padding:8px;overflow-x:auto}
.logline{all:unset;box-sizing:border-box;display:grid;grid-template-columns:64px 112px 78px 1fr;gap:8px;font:500 .8rem/1.4 var(--f-mono);color:var(--text);padding:6px 8px;border-radius:6px;cursor:pointer;min-width:420px}
.logline:hover:not(:disabled){background:var(--panel2)} .logline:focus-visible{outline:2px solid var(--gold)}
.logline.fail .lr{color:#ff9d98} .logline .lt{color:var(--muted)}
.logline.hit{background:color-mix(in srgb,var(--ok) 22%,transparent)}
.logline.gap{cursor:default;color:var(--muted);display:block;text-align:center;font-style:italic}
.door{border-radius:16px;border:2px solid var(--line);background:var(--panel);padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-height:280px;justify-content:center;transition:background .2s,border-color .2s}
.door.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.door.deny{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--panel))}
.door.learn{border-color:var(--gold)}
.door-icon{font-size:3.4rem;line-height:1}
.door-title{font:700 1.6rem var(--f-display)}
.door-sub{font:500 .9rem var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.door .codebox{width:100%}
.vault{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.vault{grid-template-columns:1fr}}
.vault-side{position:sticky;top:16px}
@media (max-width:900px){.vault-side{position:static}}
.vopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.vopts{grid-template-columns:1fr}}
.vopts .opt b{font-weight:600}
.hashline{font:600 1.15rem var(--f-mono);letter-spacing:.06em;color:var(--gold);overflow-wrap:anywhere}
.console{font:500 .88rem/1.5 var(--f-mono);background:#060d18;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:300px;max-height:300px;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.console .dim{color:var(--muted)} .console .good{color:var(--ok);font-weight:600} .console .bad{color:#ff9d98} .console .hint{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.vice{isolation:isolate;position:relative;overflow:hidden;border-radius:12px;min-height:240px;padding:24px;background:linear-gradient(155deg,#251046 15%,#9b287a 54%,#ff9b54);display:flex;flex-direction:column;justify-content:space-between;gap:20px;border:1px solid #ff6bcb}
.vice h1,.vice h2{position:relative;color:#fff4e6;text-shadow:3px 3px #aa267e;font-style:italic;z-index:2}
.vice .eyebrow{color:#ffe2a0;z-index:2}.vice-sun{position:absolute;width:160px;height:160px;border-radius:50%;background:linear-gradient(#ffde86,#ff677d);right:20px;top:30px;z-index:-1}
.vice-palms{position:absolute;bottom:0;right:10px;font-size:5rem;filter:brightness(.15);transform:rotate(-7deg);z-index:-1}
.vice.passed{min-height:180px;animation:reveal .6s ease-out}
.final-alarm{border-color:var(--red);transition:background 2s,border-color 2s}.final-alarm.restored{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.final-title{font-size:clamp(1.8rem,5vw,4rem)}.final-count{font:700 clamp(3rem,10vw,7rem) var(--f-display);text-align:center;color:var(--red)}
.system{padding:16px;border-left:3px solid var(--red);background:var(--night);transition:border-color 1s,color 1s}.system.up{border-color:var(--ok);color:var(--ok)}
.network{position:sticky;top:0;z-index:50;margin-bottom:12px}.educational{color:var(--muted);font-size:.85rem}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="network" class="wrap msg err network" role="status" hidden>Brak internetu. Wczytane treści pozostają dostępne, ale zaliczenie wymaga potwierdzenia serwera.</div>
<div id="app" class="wrap"><p class="muted">Uruchamiam terminal…</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, signOut, connectAuthEmulator } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, doc, collection, getDoc, getDocFromServer, getDocs, getDocsFromServer, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch, runTransaction, serverTimestamp, increment, Timestamp, connectFirestoreEmulator } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { PHASES, officialPoints, stationCount, buildRanking, resultsCsv } from './core.js';
import { STATION_FLAGS } from './station-flags.js';

/* Konfiguracja Firebase. Na Firebase Hosting pobiera się sama z /__/firebase/init.json.
   Do testów na innym hostingu wklej tu obiekt z konsoli (Ustawienia projektu → Twoje aplikacje). */
const MANUAL_CONFIG = null;
let bootStarted=false;

/* ===================== DANE GRY ===================== */
const STATION_PTS = 100;
const STATIONS = [
  { id:"s1", nr:1, name:"Zhakuj grę", topic:"DevTools: nie ufaj przeglądarce", frag:"SANIE",
    intro:'Na laptopie działa gra Grincha: przepaść, brak kluczy i meta tylko dla admina. W odizolowanej grze użyjcie F12. Na końcu trzeciego poziomu zobaczycie flagę — wpiszcie ją tutaj.',
    story:"Gra ufała przeglądarce: siłę skoku, liczbę kluczy i rolę gracza trzymała u was. Każdą z tych rzeczy dało się zmienić w kilka sekund. Pierwszy fragment klucza odzyskany.",
    tips:["Wszystko, co działa w przeglądarce, użytkownik może podejrzeć i zmienić (F12).","Dlatego wynik, uprawnienia czy cenę w koszyku musi sprawdzać serwer, a nie przeglądarka.",'Serwer sprawdza flagę, etap i jednokrotność zapisu. Nie udowadnia to samodzielnego przejścia gry — flagę z przeglądarki można podejrzeć lub przekazać.'] },
  { id:"s2", nr:2, name:"Złam skarbiec", topic:"Symulator łamania haseł", frag:"ZORZA",
    intro:'Grinch zmienił hasło demonstracyjnego skarbca. Dobierzcie typ hasha, słownik i maskę. Symulator pokaże odzyskane hasło jako flagę — wpiszcie ją tutaj, aby zaliczyć lab.',
    story:"Skarbiec otwarty. Hasło administratora składało się z imienia renifera i daty. Takie hasła wpadają w kilka sekund. Drugi fragment klucza jest wasz.",
    tips:["Imiona, daty i nazwy drużyn to pierwsze, co sprawdza słownik.","Długa fraza z kilku losowych słów jest dużo mocniejsza niż krótkie „H@sło1!”.","Menedżer haseł pozwala mieć różne hasło do każdego konta."] },
  { id:"s3", nr:3, name:"Fałszywy Mikołaj", topic:"Śledztwo SOC: phishing, portal, logi", frag:"KOMINEK", hasTask:true,
    intro:'Rozpocznijcie śledztwo, zbadajcie maila, portal i logi, a w czwartym zadaniu połączcie alerty w konsoli SOC. Potem osobno ułóżcie reakcję na incydent. Dopiero wtedy dostaniecie flagę labu.',
    story:"Mail przyszedł z podrobionym adresem do odpowiedzi, portal pokazywał cudze listy po zmianie numeru w adresie, a w logach widać, że Grinch zgadywał hasło admina przez 7 minut. Trzeci fragment klucza odzyskany.",
    tips:["Zanim klikniecie, sprawdźcie, kto naprawdę pisze i dokąd prowadzi link.","„Pilne!” i „do 17:00” to presja, która ma wyłączyć myślenie. Prośbę o pieniądze potwierdzajcie telefonicznie.","Jeśli po zmianie numeru w adresie widać cudze dane, to błąd strony. Zgłoście go, nie wykorzystujcie.","Setki nieudanych logowań z jednego adresu to atak. Dlatego konta blokują się po kilku próbach, a hasło admina musi być długie."] },
  { id:"s4", nr:4, name:"Biuro Grincha", topic:"Bezpieczeństwo fizyczne i Flipper Zero", frag:"RENIFER",

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (k === "class") el.className = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

async function createTeam(name, school, nick){
  for (let i=0;i<5;i++){
    const code = randomCode();
    const b = writeBatch(S.db);
    const joinCode = randomCode(6);
    const data = { name, school, createdAt:serverTimestamp(), createdBy:S.user.uid, unlocked:{}, side:{}, soc:{}, registrationOpen:true, bonus:0, joinCode, memberCount:1 };
    b.set(doc(S.db,"teams",code), data);
    b.set(doc(S.db,"teams",code,"members",S.user.uid), { nick, joinedAt:serverTimestamp() });
    b.set(doc(S.db,'leaderboard',code), publicTeam(data));
    b.set(doc(S.db,'joinCodes',joinCode), {teamId:code,createdAt:serverTimestamp()});
    try { await b.commit(); return code; } catch(e){ if (!denied(e)) throw e; }
  }
  throw new Error("Nie udało się założyć drużyny. Spróbujcie jeszcze raz.");
}
async function joinTeam(code, nick){
  if(!/^[A-Z2-9]{6}$/.test(code))throw new Error('INVALID_CODE');
  const lookup=await getDocFromServer(doc(S.db,'joinCodes',code));
  if(!lookup.exists())throw new Error('INVALID_CODE');
  const teamId=lookup.data().teamId;
  // Powrót istniejącego członka nie nadpisuje jego członkostwa ani joinedAt.
  try { const existing=await getDocFromServer(doc(S.db,'teams',teamId)); if(existing.exists())return teamId; }
  catch(e){if(!denied(e))throw e;}
  // Członkostwo i licznik w jednym batchu: reguły odrzucą piątą osobę.
  const b=writeBatch(S.db);
  b.set(doc(S.db,'teams',teamId,'members',S.user.uid),{nick,joinedAt:serverTimestamp(),joinCode:code});
  b.update(doc(S.db,'teams',teamId),{memberCount:increment(1)});
  await b.commit();
  return teamId;
}

async function officialUpdate(code, change, award){
  await runTransaction(S.db,async tx=>{
    const ref=doc(S.db,'teams',code), s=await tx.get(ref);
    if (!s.exists()) throw new Error('Nie ma drużyny');
    const t=s.data();
    if (award && t.unlocked[award.id]) throw new Error('Stacja już zaliczona.');
    const next={...t,...change};
    if (award) {
      next.unlocked={...t.unlocked,[award.id]:true};
      tx.set(doc(S.db,'teams',code,'awards',award.id),{by:S.user.uid,at:serverTimestamp(),emergency:award.emergency,reason:award.reason});
    }
    tx.update(ref,next); tx.set(doc(S.db,'leaderboard',code),publicTeam(next));
  });
}

async function claimStation(id,flag){
  if(!navigator.onLine)throw new Error('offline');
  if(!STATIONS.some(s=>s.id===id))throw new Error('INVALID_STATION');
  const teamId=S.code;
  try{await runTransaction(S.db,async tx=>{
    const ref=doc(S.db,'teams',teamId),snapshot=await tx.get(ref);
    if(!snapshot.exists())throw new Error('NOT_FOUND');
    const t=snapshot.data();if(t.unlocked?.[id]===true)return;
    const next={...t,unlocked:{...t.unlocked,[id]:true}};
    tx.set(doc(S.db,'teams',teamId,'awards',id),{by:S.user.uid,at:serverTimestamp(),emergency:false,reason:'Flaga stacji',flag:norm(flag)});
    tx.update(ref,{unlocked:next.unlocked});tx.set(doc(S.db,'leaderboard',teamId),publicTeam(next));
  });}catch(error){
    // Inny telefon mógł wygrać po naszym odczycie; audyt jest niezmienialny.
    // Nie ufamy cache ani lokalnemu statusowi — sukces potwierdza wyłącznie serwer.
    if(!denied(error))throw error;
    const confirmed=await getDocFromServer(doc(S.db,'teams',teamId));
    if(!confirmed.exists()||confirmed.data().unlocked?.[id]!==true)throw error;
  }
  if(S.code===teamId){const snapshot=await getDocFromServer(doc(S.db,'teams',teamId));S.team={id:snapshot.id,...snapshot.data()};}
}

/* AES-GCM to tylko rekwizyt symulatora. Publiczne rozwiązanie daje publiczny
   klucz: nie jest to kontrola dostępu ani zabezpieczenie oficjalnych punktów. */
async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function openSeal(material, blob){
  try {
    const raw = Uint8Array.from(atob(blob), c=>c.charCodeAt(0));
    const kb = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("biegun26|" + material));
    const key = await crypto.subtle.importKey("raw", kb, "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:raw.slice(0,12) }, key, raw.slice(12));
    return new TextDecoder().decode(pt);
  } catch(e){ return null; }
}

        const moveEv = e => { if (y0===null) return; row.style.transform="translateY("+(e.clientY-y0)+"px)"; };
        const end = e => { if (y0===null) return; const y=e.clientY; y0=null; row.classList.remove("drag"); row.style.transform="";

  foot.append(checkBtn());
  box.replaceChildren(list, foot);

function missionChime(){
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
  const audio=new Audio(),start=audio.currentTime;
  [392,523.25,659.25].forEach((frequency,i)=>{
    const oscillator=audio.createOscillator(),gain=audio.createGain(),at=start+i*.16;
    oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.08,at+.02);gain.gain.exponentialRampToValueAtTime(.001,at+.25);
    oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(at);oscillator.stop(at+.26);
    if(i===2)oscillator.onended=()=>audio.close();
  });
}

  if (s < 3600) return Math.round(s/60) + " min";
  if (s < 86400) return Math.round(s/3600) + " godz.";
  if (s < 86400*365) return Math.round(s/86400) + " dni";
  const y = s/(86400*365);

    h("div",{class:"stack",style:"gap:4px"}, h("span",{class:"eyebrow"},"Laboratorium 4 · drzwi warsztatu"), h("h1",null,"Czytnik kart")),
    screen, supported ? startBtn : null,
    h('button',{class:'btn ghost',onclick:async()=>{ try { await doorRoot.requestFullscreen(); } catch(e){ setState('idle','Tryb kiosku','Pełny ekran niedostępny. Użyj przypięcia aplikacji Android.'); } }},'Pełny ekran · kiosk'),
    h('p',{class:'small muted'},'To pokaz prostych czytników opartych na UID, nie wszystkich kart NFC. Nie odczytujemy prywatnych kart uczniów. Awaria? Prowadzący zalicza stację ręcznie.'),
    cfg, !S.isAdmin ? h('a',{href:'#admin',class:'back'},'Konfiguracja: zaloguj organizatora') : null);
  put(doorRoot);
}

/* ===================== STACJA 1: GRA DO ZHAKOWANIA (#gra) =====================
   Gra „Skok Mikołaja” na laptopy. Celowo nie da się jej przejść uczciwie.
   Uczniowie otwierają DevTools (F12) i zmieniają stan gry trzymany w przeglądarce:
   1) zmienna gra.silaSkoku, 2) gra.klucze, 3) rola w localStorage.
   Lekcja: wszystkiego, co jest w przeglądarce, nie wolno traktować jako zaufanego. */
let gameRoot = null, gameRaf = null, gameKeyDown = null, gameKeyUp = null;
function renderGame(){
  app.className='wrap wide';
  if (app.querySelector('iframe')) return;
  // Opaque origin: bez allow-same-origin. Brak dostępu do sesji/Auth/storage rodzica.
  // Brak postMessage: wynik piaskownicy nigdy nie zapisuje punktów produkcyjnych.
  const frame=h('iframe',{title:'Odizolowany Skok Mikołaja',sandbox:'allow-scripts',style:'width:100%;height:1100px;border:0;border-radius:12px'});
  const style=document.querySelector('style').textContent;
  const script=`const STATION_FLAGS=${JSON.stringify({s1:STATION_FLAGS.s1})}; const memory=new Map(); const localStorage={getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v))};
    const app=document.getElementById('app'); const put=(...n)=>app.replaceChildren(...n.flat(Infinity).filter(Boolean));
    let gameRoot=null,gameRaf=null,gameKeyDown=null,gameKeyUp=null;
    ${h.toString()} ${flagCard.toString()} ${stopGame.toString()} ${renderVulnerableGame.toString()} renderVulnerableGame();`;
  frame.srcdoc='<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; connect-src \'none\'; form-action \'none\'"><style>'+style+'</style><div id="app" class="wrap wide"></div><script>'+script+'<'+ '/script></html>';
  put(h('a',{href:'#',class:'back'},'← Terminal'),frame);
}
function stopGame(){
  cancelAnimationFrame(gameRaf); gameRaf = null;
  if (gameKeyDown) window.removeEventListener("keydown", gameKeyDown);
  if (gameKeyUp) window.removeEventListener("keyup", gameKeyUp);
  gameKeyDown = gameKeyUp = null; gameRoot = null;
}
function renderVulnerableGame(){
  app.className = "wrap wide";
  if (gameRoot && app.contains(gameRoot)) return;
  stopGame();
  try { if (!localStorage.getItem("rola")) localStorage.setItem("rola", "elf"); } catch(e){}
  const W = 960, H = 400, GROUND = 330, PW = 34, PH = 34, FLAG = 905;
  const LV = [
    { name:"Poziom 1 · Za szeroka przepaść", gaps:[[400,660]],
      goal:"Dojdźcie do flagi 🏁. Problem: przepaść jest za szeroka na zwykły skok.",
      hints:['Trop: skok jest za słaby. Kto ustala jego siłę?',"Narzędzie: F12 → Console. Wybierz kontekst ramki gry (about:srcdoc), nie główną stronę.",
             "W konsoli wpiszcie: gra.silaSkoku = 25 i naciśnijcie Enter. Potem wróćcie do gry (kliknijcie w nią) i skaczcie strzałką ↑ albo spacją."] },
    { name:"Poziom 2 · Brama na 3 klucze", gaps:[[300,370]], key:520, wall:720,
      goal:"Brama 🔒 otwiera się przy 3 kluczach. Na mapie jest tylko jeden klucz 🗝️.",
      hints:['Trop: brama ufa licznikowi kluczy na twoim urządzeniu.',"Narzędzie: F12 → Console w kontekście ramki. Obejrzyj obiekt gra.",
             "W konsoli wpiszcie: gra.klucze = 3 i Enter. Brama się otworzy."] },
    { name:"Poziom 3 · Meta tylko dla admina", gaps:[[420,500]], admin:true,
      goal:"Flaga wpuszcza tylko admina. Gra sprawdza waszą rolę… w waszej własnej przeglądarce.",
      hints:['Trop: kto nadał tej przeglądarce rolę elfa?',"Narzędzie: F12 → Console, kontekst ramki. W piaskownicy localStorage to edukacyjna atrapa w pamięci, nie dane przeglądarki organizatora.",
             "Zmieńcie wartość klucza „rola” z elf na admin. Albo w konsoli: localStorage.setItem('rola','admin') i Enter. Potem dojdźcie do flagi."] }
  ];
  const gra = window.gra = { silaSkoku:9, predkosc:4, grawitacja:0.5, klucze:0, poziom:1 };
   let cur = 0, p, keys = {}, gotKey = false, msg = "", msgUntil = 0, won = false, deaths = 0, hintLvl = 0;
   const stars=new Set();
  const role = () => { try { return localStorage.getItem("rola") || "elf"; } catch(e){ return "elf"; } };
  const say = (t, ms=2200) => { msg = t; msgUntil = performance.now() + ms; };
  const startLevel = n => { cur = n; gra.poziom = n + 1; gotKey = false; gra.klucze = 0; p = { x:30, y:GROUND-PH, vx:0, vy:0, on:true }; hintLvl = 0; drawInfo(); };
  const respawn = () => { p = { x:30, y:GROUND-PH, vx:0, vy:0, on:true }; };

  const cv = h("canvas",{width:String(W),height:String(H),class:"gamecv",tabindex:"0","aria-label":"Gra Skok Mikołaja"});
  const ctx = cv.getContext("2d");
  const info = h("div",{class:"stack",style:"gap:8px"});
  const hintBox = h("div");
  const result = h("div",{class:"stack"});
  function drawInfo(){
    const L = LV[cur];
    hintBox.replaceChildren();
    info.replaceChildren(
       h("div",{class:"spread"}, h("h2",null,L.name), h("span",{class:"pill gold"},'WANTED KNOWLEDGE '+ '★'.repeat(stars.size)+'☆'.repeat(3-stars.size))),
      h("p",null,L.goal),
      h("div",{class:"row"},
        h("button",{class:"btn ghost sm",onclick:()=>{
          hintLvl = Math.min(hintLvl+1, L.hints.length);
           hintBox.replaceChildren(...L.hints.slice(0,hintLvl).map((t,i)=>h("div",{class:"msg",style:"margin-top:6px"}, h("b",null,['Trop','Narzędzie','Dokładna instrukcja'][i]+': '), t)));
          cv.focus();
        }},"💡 Podpowiedź"),
        h("button",{class:"btn ghost sm",onclick:()=>{ respawn(); cv.focus(); }},"↺ Od początku poziomu")),
      hintBox);
  }

   function step(){
    // ktoś zmienił gra.poziom w konsoli? też się liczy
    const want = Math.round(Number(gra.poziom)) - 1;
     if (want !== cur && want >= 0 && want < LV.length) startLevel(want);
     const L = LV[cur]; // konfiguracja dopiero po ewentualnej zmianie poziomu
    if (!won){
      const sp = Math.max(0, Math.min(Number(gra.predkosc) || 0, 30));
      const g = Math.max(0.05, Math.min(Number(gra.grawitacja) || 0.5, 5));
      p.vx = (keys.left ? -sp : 0) + (keys.right ? sp : 0);
      if (keys.jump && p.on){ p.vy = -Math.max(0, Math.min(Number(gra.silaSkoku) || 0, 40)); p.on = false; }
      p.vy += g; p.x += p.vx; p.y += p.vy;   // bez sufitu: mocny skok może wylecieć ponad ekran
      if (p.x < 0) p.x = 0;
      // brama (pełna wysokość, nie da się jej przeskoczyć)
      const wallOpen = L.wall && Number(gra.klucze) >= 3;
      if (L.wall && !wallOpen && p.x + PW > L.wall && p.x < L.wall + 26){ p.x = L.wall - PW; if (performance.now() > msgUntil) say("🔒 Brama zamknięta: potrzeba 3 kluczy, macie " + (Number(gra.klucze)||0) + "."); }
      // podłoga i przepaście
      const cx = p.x + PW/2;
      const overGap = L.gaps.some(([a,b]) => cx > a && cx < b);
      if (!overGap && p.y + PH >= GROUND && p.vy >= 0){ p.y = GROUND - PH; p.vy = 0; p.on = true; }
      else p.on = false;
      if (p.y > H + 40){ deaths++; respawn(); say(deaths >= 2 ? "Spadliście! Uczciwie się nie da. Może podpowiedź? 💡" : "Spadliście! Spróbujcie jeszcze raz."); }
      // klucz
      if (L.key && !gotKey && Math.abs(cx - L.key) < 24 && p.y + PH > GROUND - 60){ gotKey = true; gra.klucze = (Number(gra.klucze)||0) + 1; say("🗝️ Klucz! Macie " + gra.klucze + "/3."); }
      // meta
      if (p.x + PW >= FLAG){
         if (!L.admin){ stars.add(cur); say("✅ Poziom zaliczony!", 1600); startLevel(cur + 1); }
        else if (role() !== "admin"){ p.x = FLAG - PW - 40; say("⛔ Meta tylko dla admina. Wasza rola w przeglądarce: „" + role() + "”."); }
         else { stars.add(cur); won = true; drawInfo(); finish(); }
      }
    }
     draw(LV[cur]);
     if (!won && !document.hidden) gameRaf = requestAnimationFrame(step); else gameRaf=null;
  }

  function draw(L){
    const sky = ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#0d1b33"); sky.addColorStop(1,"#1d3658");
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,.75)";
    for (let i=0;i<40;i++){ const x=(i*97+cur*53)%W, y=(i*61)%(GROUND-60); ctx.fillRect(x,y,2,2); }
    // ziemia z dziurami
    let x0 = 0;
    const segs = [];
    for (const [a,b] of L.gaps){ segs.push([x0,a]); x0 = b; }
    segs.push([x0,W]);
    for (const [a,b] of segs){ ctx.fillStyle="#e8eef6"; ctx.fillRect(a,GROUND,b-a,8); ctx.fillStyle="#2a4266"; ctx.fillRect(a,GROUND+8,b-a,H-GROUND); }
    for (const [a,b] of L.gaps){ ctx.fillStyle="rgba(229,85,79,.85)"; ctx.font="600 14px 'IBM Plex Mono',monospace"; ctx.textAlign="center"; ctx.fillText("przepaść · " + (b-a) + " px", (a+b)/2, GROUND+30); }
    ctx.textAlign="left";
    if (L.wall){
      const open = Number(gra.klucze) >= 3;
      ctx.fillStyle = open ? "rgba(82,196,143,.25)" : "#5a2a2a"; ctx.fillRect(L.wall,0,26,GROUND);
      ctx.font="28px serif"; ctx.fillText(open ? "🔓" : "🔒", L.wall-4, GROUND-40);
    }
    ctx.font="30px serif";
    if (L.key && !gotKey) ctx.fillText("🗝️", L.key-15, GROUND-14);
    ctx.fillText("🏁", FLAG, GROUND-6);
    ctx.font = "34px serif"; ctx.fillText("🎅", p.x-2, p.y+PH-4);
    // HUD: celowo pokazuje zmienne, które da się zmienić
    ctx.fillStyle="rgba(13,24,40,.75)"; ctx.fillRect(10,10,330,92);
    ctx.fillStyle="#f2c14e"; ctx.font="600 14px 'IBM Plex Mono',monospace";
    ctx.fillText("gra.silaSkoku = " + gra.silaSkoku, 20, 32);
    ctx.fillText("gra.klucze    = " + gra.klucze, 20, 52);
    ctx.fillText("rola (Local Storage) = " + role(), 20, 72);
    ctx.fillStyle="#93a7c3"; ctx.fillText("← → ruch · ↑ / spacja skok", 20, 92);
    if (performance.now() < msgUntil){
      ctx.fillStyle="rgba(13,24,40,.85)"; ctx.fillRect(W/2-300,H/2-60,600,48);
      ctx.fillStyle="#e9eff7"; ctx.font="600 16px 'IBM Plex Sans',sans-serif"; ctx.textAlign="center";
      ctx.fillText(msg, W/2, H/2-30); ctx.textAlign="left";
    }
  }

   function reset(){
     cancelAnimationFrame(gameRaf); gameRaf=null;
     localStorage.setItem('rola','elf');
     Object.assign(gra,{silaSkoku:9,predkosc:4,grawitacja:0.5,klucze:0,poziom:1});
     keys={}; gotKey=false; msg=''; msgUntil=0; won=false; deaths=0; hintLvl=0; stars.clear();
     result.replaceChildren(); startLevel(0); cv.focus(); gameRaf=requestAnimationFrame(step);
   }
   function finish(){
    result.replaceChildren(
      h("div",{class:"card",style:"text-align:center"},
        h("span",{class:"eyebrow",style:"color:var(--ok)"},"Gra zhakowana · meta osiągnięta"),
         h("div",{class:"codebox"},'★★★'),
         h("p",null,'Odzyskana flaga czeka poniżej. Wpisz ją w terminalu drużyny, w labie 1.')),
       flagCard('s1'),
       h('section',{class:'card'},h('h3',null,'Dwa światy: komu ufamy?'),
         h('p',null,'Niezabezpieczona gra: klient deklaruje „mam klucze i jestem adminem” → lokalna meta ufa temu bez sprawdzania.'),
         h('p',null,'Zabezpieczona wersja: zaufany serwer sprawdza zdarzenia i uprawnienia. Tutaj sama zmiana gra.klucze nie zapisuje punktów — wpisujesz flagę do osobnego terminala. Flaga z przeglądarki nie dowodzi jednak samodzielnego przejścia gry.')),
      h("section",{class:"card"}, h("h3",null,"Czego się nauczyliście"),
        h("ul",{class:"tips"},
          h("li",null,"Gra trzymała siłę skoku, liczbę kluczy i rolę gracza w przeglądarce. Każdą z tych rzeczy zmieniliście w DevTools."),
          h("li",null,"Dlatego ważnych rzeczy (wyniku, uprawnień, ceny w koszyku) nigdy nie sprawdza się tylko w przeglądarce. Musi to robić serwer."),
           h("li",null,'Serwer sprawdza flagę i dopuszcza tylko jedno zaliczenie w czasie gry. Nie sprawdzi, czy ktoś przekazał wam wspólną flagę.'))),
       h("button",{class:"btn ghost",onclick:reset},"Nowa drużyna (reset gry)"));
    result.scrollIntoView({ behavior:"smooth", block:"start" });
  }

  const map = k => k === "ArrowLeft" || k === "a" ? "left" : k === "ArrowRight" || k === "d" ? "right" : (k === "ArrowUp" || k === " " || k === "w") ? "jump" : null;
   gameKeyDown = e => { if (document.activeElement && ["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement.tagName)) return; const m = map(e.key); if (m){ keys[m] = true; e.preventDefault(); } };
  gameKeyUp = e => { const m = map(e.key); if (m) keys[m] = false; };
  window.addEventListener("keydown", gameKeyDown);
  window.addEventListener("keyup", gameKeyUp);
  const pad = (label, k) => h("button",{class:"btn ghost",style:"touch-action:none;user-select:none",
     onpointerdown:e=>{ e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId); keys[k] = true; }, onpointerup:()=>{ keys[k] = false; }, onpointercancel:()=>{ keys[k]=false; }, onlostpointercapture:()=>{ keys[k]=false; }, onkeydown:e=>{if(e.key===' '||e.key==='Enter'){keys[k]=true;e.preventDefault();}},onkeyup:()=>{keys[k]=false;}}, label);
   window.addEventListener('blur',()=>{keys={};});
   document.addEventListener('visibilitychange',()=>{
     keys={}; if(document.hidden){cancelAnimationFrame(gameRaf);gameRaf=null;}
     else if(!won&&!gameRaf) gameRaf=requestAnimationFrame(step);
   });
   window.addEventListener('pagehide',stopGame);

  gameRoot = h("div",{class:"stack",style:"gap:16px"},
    h("div",{class:"stack",style:"gap:4px"}, h("span",{class:"eyebrow"},"Laboratorium 1 · zhakuj grę"), h("h1",null,"Skok Mikołaja")),
     h("p",null,'Zmieńcie grę w przeglądarce. W DevTools wybierzcie kontekst ramki about:srcdoc. Na końcu trzeciego poziomu pojawi się flaga labu 1. Piaskownica nie ma dostępu do sesji ani danych Firebase.'),
    h("div",{class:"gamewrap"}, cv),
    h("div",{class:"row",style:"justify-content:center"}, pad("◀","left"), pad("⤒ skok","jump"), pad("▶","right")),
     info, h('button',{class:'btn ghost',onclick:reset},'Nowa drużyna (reset gry)'), result);
  put(gameRoot);
  startLevel(0);
  cv.focus();
  gameRaf = requestAnimationFrame(step);
}

/* ===================== ROUTER ===================== */
const route = () => (location.hash||"").replace("#","");
function render(){
  const r = route();
  watchTeams(r === "ekran" || r === "final" || (r === "admin" && S.isAdmin));
  if (!["ekran","final"].includes(r)) clearInterval(clockTimer);
  if (r !== "skarbiec"){ clearInterval(vaultTimer); vaultRoot = null; }
  if (r !== "drzwi"){ doorAbort?.abort(); doorAbort = null; doorRoot = null; clearTimeout(doorReset); doorLearn=false; try { doorWake?.release(); } catch(e){} }
  if (r !== "gra" && gameRoot) stopGame();
  if (r === "gra") return renderGame();
  if (r === "ekran") renderScreen();
  else if (r === 'final') renderFinal();
  else if (r === "admin") renderAdmin();
  else if (r === "pulapka") renderTrap();
  else if (r === "skarbiec") renderVault();
  else if (r === "drzwi") renderDoor();
  else renderPlayer();
}
// odświeżenie po zmianie danych – bez przerywania kogoś w trakcie pisania albo zadania
function refresh(){
  const r = route(), a = document.activeElement, typing = a && ["INPUT","SELECT","TEXTAREA"].includes(a.tagName);
  if (r === "ekran") return renderScreen();
  if (r === 'final') return renderFinal();
  if (typing) return;
  if (r === "admin") return S.user && !S.user.isAnonymous ? renderAdmin() : undefined; // nie kasuj formularza logowania
  if (r === "pulapka" || r === "skarbiec" || r === "drzwi" || r === "gra") return;
  if (!S.code || !S.teamLoaded || ['home','station','key','s3hub'].includes(view.type)) renderPlayer();
}
window.addEventListener("hashchange", ()=>{ adminMsg = {text:"",kind:""}; if(!bootStarted&&route()!=='gra')boot(); render(); window.scrollTo(0,0); });
function networkStatus(){ document.getElementById('network').hidden=navigator.onLine; }
window.addEventListener('online',networkStatus);window.addEventListener('offline',networkStatus);networkStatus();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script>
